<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ObjectLog is a local-first iPhone app for organizing clients, job sites, jobs, before-and-after photos, and PDF reports.">
  <meta name="theme-color" content="#f5f7ff">
  <meta property="og:title" content="ObjectLog — clients, job sites, and jobs in one app">
  <meta property="og:description" content="A local-first job and work logbook for field professionals. Available on the App Store.">
  <meta property="og:type" content="website">
  <meta http-equiv="refresh" content="3; url=en/">
  <title>ObjectLog</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    (function () {
      var language = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
      var isRussian = /^ru(?:-|$)/i.test(language);
      window.location.replace(isRussian ? "ru/" : "en/");
    }());
  </script>
</head>
<body>
  <main class="shell gateway">
    <section class="card gateway-card">
      <img src="assets/logo.svg" alt="ObjectLog logo">
      <h1>ObjectLog</h1>
      <p class="lead">Choose your language · Выберите язык</p>
      <div class="actions">
        <a class="button" href="ru/" lang="ru">Русский</a>
        <a class="button primary" href="en/">English</a>
      </div>
    </section>
  </main>
</body>
</html>
